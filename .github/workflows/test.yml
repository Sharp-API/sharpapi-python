name: Tests

on:
  push:
    branches: [main, "mergify/merge-queue/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[pandas,test]"
          pip install ruff pyright build

      - name: Ruff check
        run: ruff check

      - name: Pyright
        run: pyright

      # Run fixture-based regression tests alongside lint and type checks.
      # These catch model/wire mismatches such as those reported in #18.
      - name: Pytest
        run: pytest -q

      - name: Build distributions
        run: python -m build
